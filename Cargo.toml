[package]
name = "Socks5BalancerRust"
version = "0.1.0"
edition = "2024"
description = "Socks5BalancerAsio 的 Rust 移植：多上游 SOCKS5 代理 TCP 负载均衡器"
license = "GPL-3.0"

[lib]
# 库名用 snake_case，便于 fuzz/集成测试以 `socks5_balancer_rust` 引用
name = "socks5_balancer_rust"
path = "src/lib.rs"

[dependencies]
# 异步运行时与网络（ADR-007）
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "signal",
    "macros",
] }
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = { version = "0.5", features = ["all"] }

# 配置与序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志（ADR-007：tracing 三件套，异步 writer）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 命令行
clap = { version = "4", features = ["derive"] }

# 错误类型（ADR-007：边界层使用 thiserror）
thiserror = "2"

# 全局分配器（ADR-007）。libmimalloc-sys 直接依赖仅用于设置 mimalloc 运行期选项
# （free() 后尽早把空闲页归还 OS，保证 10K 连接 RSS 口径，见 docs/12 与 main.rs）。
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = [
    "extended",
] }
tokio-socks = "0.5.3"
fastrand = "2.5.0"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7.1"
rustls-pki-types = "1.15.1"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
rustls-pemfile = "2.2.0"
httparse = "1.10.1"
http = "1.5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
overflow-checks = false

[dev-dependencies]
rcgen = "0.14.10"
